<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBO 스카우팅 리포트</title>
    <!-- Favicon 설정 -->
    <link rel="icon" type="image/png" href="./sbo-logo.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1b263b 50%, #223048 100%);
            color: #f1f5f9;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1b263b;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a6572;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #607d8b;
        }

        .splash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0d131d;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .splash-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        @keyframes pulse-logo {
            0% {
                transform: scale(0.95);
                filter: drop-shadow(0 0 0px rgba(96, 165, 250, 0.3));
            }
            100% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 15px rgba(96, 165, 250, 0.6));
            }
        }

        .animate-sbo-logo {
            animation: pulse-logo 1.2s infinite alternate ease-in-out;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-100">

    <!-- SBO 로딩 스플래시 오버레이 -->
    <div id="splashOverlay" class="splash-overlay">
        <img src="./sbo-logo.png" alt="SBO Logo" class="h-24 w-auto object-contain select-none mb-4 animate-sbo-logo" style="mix-blend-mode: screen;" onerror="this.onerror=null; this.alt='SBO LOGO';"/>
        <h1 class="text-2xl font-black tracking-widest text-white uppercase font-mono">SBO SCOUTING REPORT</h1>
        <p class="text-xs text-sky-400 mt-2 tracking-wider font-semibold">LOADING SYSTEM...</p>
    </div>

    <!-- Header Navigation -->
    <header class="bg-[#151d2a]/90 backdrop-blur border-b border-slate-700/60 px-6 py-3 flex justify-between items-center z-20">
        <div class="flex items-center gap-4">
            <div class="flex items-center">
                <img src="./sbo-logo.png" alt="SBO Logo" class="h-10 w-auto object-contain select-none" style="mix-blend-mode: screen;" onerror="this.onerror=null; this.alt='SBO LOGO';"/>
            </div>
            <div class="h-6 w-px bg-slate-700/60"></div>
            <div>
                <h1 class="font-bold text-base leading-none text-slate-100">SBO 스카우팅 리포트</h1>
                <span class="text-[10px] text-slate-400">SBO Baseball Scouting System</span>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="toggleModal(true)" class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs transition-all shadow-md shadow-sky-600/20 flex items-center gap-1.5">
                <i data-lucide="user-plus" class="w-4 h-4"></i> 신규 선수 등록
            </button>
            <span class="text-xs bg-[#1e293b] px-3 py-2 rounded-xl border border-slate-700 text-slate-300 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
                <span id="registered-count">등록된 선수 0명</span>
            </span>
        </div>
    </header>

    <!-- Main Section -->
    <main class="flex-1 p-4 overflow-hidden relative">

        <section class="w-full h-full grid grid-cols-12 gap-4">
            <!-- Left Side: Roster List & Category Tabs -->
            <div class="col-span-4 bg-[#182232]/80 border border-slate-700/50 rounded-2xl p-4 flex flex-col gap-3 overflow-hidden backdrop-blur shadow-xl">
                
                <div class="flex items-center gap-1 bg-[#0f172a] p-1 rounded-xl border border-slate-700/60">
                    <button onclick="changeTab('ALL')" id="tab-ALL" class="flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all text-white bg-sky-600 shadow">전체</button>
                    <button onclick="changeTab('NEW')" id="tab-NEW" class="flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all text-teal-400 hover:text-teal-300">신규</button>
                    <button onclick="changeTab('P')" id="tab-P" class="flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all text-slate-400 hover:text-white">투수</button>
                    <button onclick="changeTab('C')" id="tab-C" class="flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all text-slate-400 hover:text-white">포수</button>
                    <button onclick="changeTab('INF')" id="tab-INF" class="flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all text-slate-400 hover:text-white">내야수</button>
                    <button onclick="changeTab('OF')" id="tab-OF" class="flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all text-slate-400 hover:text-white">외야수</button>
                </div>

                <div class="flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <h2 class="text-sm font-bold flex items-center gap-2 text-white shrink-0">
                            <i data-lucide="users" class="w-4 h-4 text-sky-400"></i> SBO 명단
                        </h2>
                    </div>

                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="roster-search-input" oninput="renderRosterList()" placeholder="선수 이름/포지션 검색..." class="w-full bg-[#0f172a] border border-slate-700 text-xs rounded-lg pl-9 pr-4 py-2 text-white focus:outline-none focus:border-sky-500">
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto pr-1">
                    <div id="roster-list-container" class="space-y-2">
                        <!-- Dynamic Player Cards -->
                    </div>
                </div>
            </div>

            <!-- Right Side: Scouting Report Details -->
            <div class="col-span-8 bg-[#182232]/80 border border-slate-700/50 rounded-2xl p-5 flex flex-col overflow-y-auto backdrop-blur gap-4 shadow-xl justify-center items-center" id="report-view-container">
                <!-- Dynamic Scouting Report Detail or Default Empty View -->
            </div>
        </section>

    </main>

    <!-- 선수 등록 모달 -->
    <div id="playerModal" class="fixed inset-0 bg-slate-950/75 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-[#182232] border border-slate-700 rounded-2xl w-full max-w-lg p-5 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center pb-3 border-b border-slate-700/60 mb-4">
                <div class="flex items-center gap-2">
                    <i data-lucide="user-plus" class="w-5 h-5 text-sky-400"></i>
                    <h2 class="text-base font-bold text-white">신규 선수 등록</h2>
                </div>
                <button onclick="toggleModal(false)" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="add-player-form" onsubmit="handleAddPlayerSubmit(event)" class="space-y-3 text-xs">
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="form-is-wbd" class="w-4 h-4 rounded border-slate-700 text-sky-600 focus:ring-sky-500 bg-[#0f172a]">
                    <label for="form-is-wbd" class="text-slate-200 font-semibold cursor-pointer">WBD 경험자인 경우 체크 (체크 해제 시 신규 신청자)</label>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1 font-semibold">포지션 구분</label>
                        <select id="form-pos" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500">
                            <optgroup label="겸업 / 투수">
                                <option value="P, LF">P, LF (투타겸업)</option>
                                <option value="P">P (투수)</option>
                            </optgroup>
                            <optgroup label="포수">
                                <option value="C">C (포수)</option>
                            </optgroup>
                            <optgroup label="내야수">
                                <option value="1B">1B (1루수)</option>
                                <option value="2B">2B (2루수)</option>
                                <option value="3B">3B (3루수)</option>
                                <option value="SS">SS (유격수)</option>
                            </optgroup>
                            <optgroup label="외야수">
                                <option value="LF">LF (좌익수)</option>
                                <option value="CF">CF (중견수)</option>
                                <option value="RF">RF (우익수)</option>
                                <option value="OF">OF (외야수)</option>
                            </optgroup>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-semibold">등번호</label>
                        <input type="text" id="form-number" placeholder="예: No.7" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-semibold">선수 이름</label>
                        <input type="text" id="form-name" required placeholder="예: 홍길동" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1 font-semibold">신장 (cm)</label>
                        <input type="text" id="form-height" placeholder="예: 182cm" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-sky-300 mb-1 font-semibold flex items-center gap-1">
                            <i data-lucide="image" class="w-3.5 h-3.5"></i> 프로필 이미지 파일명
                        </label>
                        <input type="text" id="form-image" placeholder="예: photo.webp" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500">
                    </div>
                </div>

                <div>
                    <label class="block text-slate-400 mb-1 font-semibold">SOOP 방송국 링크</label>
                    <input type="text" id="form-station" placeholder="https://www.sooplive.com/station/..." class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500">
                </div>

                <!-- 타자 세부 스탯 -->
                <div class="bg-[#0f172a] p-3 rounded-xl border border-slate-700/80">
                    <label class="block text-sky-300 mb-1.5 font-semibold text-[11px]">타자 세부 능력치 (피삼진율은 높을수록 감점)</label>
                    <div class="grid grid-cols-5 gap-1.5">
                        <div>
                            <span class="text-[9px] text-slate-400 block text-center">컨택</span>
                            <input type="number" step="0.1" min="0" max="10" id="form-b1" value="5.0" required class="w-full bg-[#182232] border border-slate-700 rounded-lg p-1.5 text-center text-white font-bold">
                        </div>
                        <div>
                            <span class="text-[9px] text-slate-400 block text-center">파워</span>
                            <input type="number" step="0.1" min="0" max="10" id="form-b2" value="5.0" required class="w-full bg-[#182232] border border-slate-700 rounded-lg p-1.5 text-center text-white font-bold">
                        </div>
                        <div>
                            <span class="text-[9px] text-slate-400 block text-center">수비</span>
                            <input type="number" step="0.1" min="0" max="10" id="form-b3" value="5.0" required class="w-full bg-[#182232] border border-slate-700 rounded-lg p-1.5 text-center text-white font-bold">
                        </div>
                        <div>
                            <span class="text-[9px] text-red-400 block text-center">피삼진율</span>
                            <input type="number" step="0.1" min="0" max="10" id="form-b4" value="5.0" required class="w-full bg-[#182232] border border-slate-700 rounded-lg p-1.5 text-center text-white font-bold">
                        </div>
                        <div>
                            <span class="text-[9px] text-slate-400 block text-center">출루율</span>
                            <input type="number" step="0.1" min="0" max="10" id="form-b5" value="5.0" required class="w-full bg-[#182232] border border-slate-700 rounded-lg p-1.5 text-center text-white font-bold">
                        </div>
                    </div>
                </div>

                <!-- 투수 세부 스탯 (투수/겸업일 때만 반영) -->
                <div class="bg-[#0f172a] p-3 rounded-xl border border-slate-700/80">
                    <label class="block text-teal-300 mb-1.5 font-semibold text-[11px]">투수 세부 능력치 (투수 및 겸업 선수만 해당)</label>
                    <div class="grid grid-cols-5 gap-1.5">
                        <div>
                            <span class="text-[9px] text-slate-400 block text-center">구속</span>
                            <input type="number" step="0.1" min="0" max="10" id="form-p1" value="5.0" class="w-full bg-[#182232] border border-slate-700 rounded-lg p-1.5 text-center text-white font-bold">
                        </div>
                        <div>
                            <span class="text-[9px] text-slate-400 block text-center">제구</span>
                            <input type="number" step="0.1" min="0" max="10" id="form-p2" value="5.0" class="w-full bg-[#182232] border border-slate-700 rounded-lg p-1.5 text-center text-white font-bold">
                        </div>
                        <div>
                            <span class="text-[9px] text-slate-400 block text-center">구위</span>
                            <input type="number" step="0.1" min="0" max="10" id="form-p3" value="5.0" class="w-full bg-[#182232] border border-slate-700 rounded-lg p-1.5 text-center text-white font-bold">
                        </div>
                        <div>
                            <span class="text-[9px] text-slate-400 block text-center">체력</span>
                            <input type="number" step="0.1" min="0" max="10" id="form-p4" value="5.0" class="w-full bg-[#182232] border border-slate-700 rounded-lg p-1.5 text-center text-white font-bold">
                        </div>
                        <div>
                            <span class="text-[9px] text-slate-400 block text-center">삼진율</span>
                            <input type="number" step="0.1" min="0" max="10" id="form-p5" value="5.0" class="w-full bg-[#182232] border border-slate-700 rounded-lg p-1.5 text-center text-white font-bold">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-teal-300 mb-1 font-semibold">신청자 소개글 (자기소개 및 각오)</label>
                    <textarea id="form-intro" rows="2" placeholder="신청자가 작성한 소개글을 입력하세요..." class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-teal-500"></textarea>
                </div>

                <div>
                    <label class="block text-amber-300 mb-1 font-semibold flex items-center gap-1">
                        <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> 스카우트 사견 (풀트력 평가)
                    </label>
                    <textarea id="form-report" rows="2" placeholder="주관적인 풀트력 및 기량 분석 의견을 입력하세요..." class="w-full bg-[#0f172a] border border-amber-500/40 rounded-lg p-2 text-white focus:outline-none focus:border-amber-400"></textarea>
                </div>

                <div>
                    <label class="block text-slate-400 mb-1 font-semibold">하이라이트 영상 설명 / 링크</label>
                    <input type="text" id="form-title" placeholder="예: 하이라이트 클립" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 mb-1.5 text-white focus:outline-none focus:border-sky-500">
                    <input type="text" id="form-url" placeholder="https://vod.sooplive.co.kr/player/... 또는 캐치 링크" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="toggleModal(false)" class="w-1/3 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold hover:bg-slate-700 transition-all">취소</button>
                    <button type="submit" class="w-2/3 py-2.5 rounded-xl bg-sky-600 text-white font-bold hover:bg-sky-500 transition-all shadow-lg shadow-sky-600/30 flex items-center justify-center gap-1.5">
                        <i data-lucide="plus" class="w-4 h-4"></i> 선수 등록 완료
                    </button>
                </div>
            </form>
        </div>
    </div>

            if (pos.includes('C')) return 'C';
            if (['1B', '2B', '3B', 'SS'].some(p => pos.includes(p))) return 'INF';

            return 'ETC';
        }

            if (p.batterStats) {
                let bScores = [p.batterStats[0], p.batterStats[1], p.batterStats[2], calcStrikeoutScore(p.batterStats[3]), p.batterStats[4]];

            }
            
            if (p.pitcherStats && p.batterStats) {
                p.ovr = parseFloat(((pAvg + bAvg)/2).toFixed(1));

                p.ovr = parseFloat(pAvg.toFixed(1));

            const modal = document.getElementById("playerModal");

        function changeTab(tabCategory) {
            currentTab = tabCategory;
            selectedPlayerId = null;
            
            const tabs = ['ALL', 'NEW', 'P', 'C', 'INF', 'OF'];
            tabs.forEach(tab => {
                const btn = document.getElementById(`tab-${tab}`);
                if (tab === tabCategory) {
                    btn.className = (tab === 'NEW')
                        ? "flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all text-white bg-teal-600 shadow"
                        : "flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all text-white bg-sky-600 shadow";
                } else {
                    btn.className = "flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all text-slate-400 hover:text-white";
                }
            });

            renderRosterList();
        }

        function renderRosterList() {
            const container = document.getElementById("roster-list-container");
            const searchText = document.getElementById("roster-search-input").value.trim().toLowerCase();

            let list = [...playersData];

            if (currentTab === "NEW") list = list.filter(p => !p.isWbd);
            else if (currentTab !== "ALL") list = list.filter(p => getPosCategory(p.pos) === currentTab);

            if (searchText) {
                list = list.filter(p => p.name.toLowerCase().includes(searchText) || p.pos.toLowerCase().includes(searchText));
            }

            document.getElementById("registered-count").innerText = `등록된 선수 ${playersData.length}명`;

            if (list.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs border border-dashed border-slate-700/60 rounded-xl">등록된 선수가 없습니다.</div>`;
                renderScoutingReportDetail(null);
                return;
            }

            if (selectedPlayerId && !list.some(p => p.id === selectedPlayerId)) {
                selectedPlayerId = null;
            }

            container.innerHTML = list.map(player => {
                const isSelected = player.id === selectedPlayerId;
                
                let thumbImg = player.image 
                    ? `<img src="${player.image}" alt="${player.name}" class="w-10 h-10 rounded-lg object-cover border border-slate-600 shrink-0" onError="this.style.display='none';"/>`
                    : `<div class="w-10 h-10 bg-slate-800 rounded-lg border border-slate-600 flex items-center justify-center font-bold text-xs text-sky-400 shrink-0">${player.pos}</div>`;

                const badge = player.isWbd 
                    ? `<span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[9px] px-1.5 py-0.2 rounded font-bold">WBD 경험자</span>`
                    : `<span class="bg-teal-500/20 text-teal-300 border border-teal-500/40 text-[9px] px-1.5 py-0.2 rounded font-bold">신규 신청자</span>`;

                return `
                    <div onclick="selectPlayerFromList(${player.id})" class="p-3 rounded-xl border transition-all cursor-pointer flex items-center justify-between ${isSelected ? 'bg-sky-600/25 border-sky-400 shadow-md shadow-sky-950/40' : 'bg-[#0f172a]/70 border-slate-700/60 hover:border-slate-500 hover:bg-[#152033]'}">
                        <div class="flex items-center gap-3">
                            ${thumbImg}
                            <div>
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span class="text-xs font-bold text-sky-300 font-mono">${player.number}</span>
                                    <h3 class="font-bold text-sm text-white">${player.name}</h3>
                                    <span class="text-[10px] text-sky-300 font-bold bg-sky-950/80 px-1.5 py-0.5 rounded border border-sky-700/60">${player.pos}</span>
                                    ${badge}
                                </div>
                                <span class="text-[10px] text-slate-400">${player.statPrimary}</span>
                            </div>
                        </div>
                        <div class="text-right shrink-0">
                            <span class="text-xs font-extrabold text-yellow-400 block">★ ${player.ovr}</span>
                            <span class="text-[10px] text-slate-400">OVR</span>
                        </div>
                    </div>
                `;
            }).join('');

            renderScoutingReportDetail(selectedPlayerId);
        }

            destroyCharts();

                    type: 'radar',
                    data: {
                        labels: ['구속', '제구', '구위', '체력', '삼진율'],
                        datasets: [{
                            label: '투구 평가',
                            data: player.pitcherStats,
                            backgroundColor: 'rgba(56, 189, 248, 0.25)',
                            borderColor: '#38bdf8',
                            borderWidth: 2,
                            pointBackgroundColor: '#7dd3fc'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            r: {
                                angleLines: { color: '#334155' },
                                grid: { color: '#334155' },
                                pointLabels: { color: '#e2e8f0', font: { size: 9, weight: 'bold' } },
                                ticks: { display: false },
                                suggestedMin: 0,
                                suggestedMax: 10
                            }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
            }

            if (player.batterStats && document.getElementById('batterRadarChart')) {
                const ctxB = document.getElementById('batterRadarChart').getContext('2d');
                const calculatedBatterData = [
                    player.batterStats[0],
                    player.batterStats[1],
                    player.batterStats[2],
                    calcStrikeoutScore(player.batterStats[3]),
                    player.batterStats[4]
                ];

                bChartInstance = new Chart(ctxB, {
                    type: 'radar',
                    data: {
                        labels: ['컨택', '파워', '수비', '피삼진점수', '출루율'],
                        datasets: [{
                            label: '타격 평가',
                            data: calculatedBatterData,
                            backgroundColor: 'rgba(52, 211, 153, 0.25)',
                            borderColor: '#34d399',
                            borderWidth: 2,
                            pointBackgroundColor: '#6ee7b7'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            r: {
                                angleLines: { color: '#334155' },
                                grid: { color: '#334155' },
                                pointLabels: { color: '#e2e8f0', font: { size: 9, weight: 'bold' } },
                                ticks: { display: false },
                                suggestedMin: 0,
                                suggestedMax: 10
                            }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
            }
        }

        function parseVideoEmbedUrl(url) {
            if (!url) return `<div class="text-center text-slate-500 text-xs">등록된 하이라이트 영상이 없습니다.</div>`;
            
            if (url.includes('sooplive.co.kr') || url.includes('afreecatv.com') || url.includes('sooplive.com')) {
                if (url.includes('catch')) {
                    let catchMatch = url.match(/(?:catch\/|catch\.sooplive\.co\.kr\/|c_no=)(\d+)/) || url.match(/\/(\d+)/);
                    if (catchMatch && catchMatch[1]) {
                        return `<iframe class="w-full h-full" src="https://vod.sooplive.co.kr/catch/${catchMatch[1]}/embed" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                    }
                }
                let match = url.match(/(?:player\/|b_no=)(\d+)/);
                if (match && match[1]) {
                    return `<iframe class="w-full h-full" src="https://vod.sooplive.co.kr/player/${match[1]}/embed" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                }
            }
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split('?')[0].split('&')[0];
                else if (url.includes('v=')) videoId = url.split('v=')[1].split('&')[0].split('?')[0];
                if (videoId) return `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            }
            return `<iframe class="w-full h-full" src="${url}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        }

        function handleAddPlayerSubmit(e) {
            e.preventDefault();
            const posVal = document.getElementById("form-pos").value;
            const isWbd = document.getElementById("form-is-wbd").checked;
            
            const b1 = parseFloat(document.getElementById("form-b1").value) || 0;
            const b2 = parseFloat(document.getElementById("form-b2").value) || 0;
            const b3 = parseFloat(document.getElementById("form-b3").value) || 0;
            const b4 = parseFloat(document.getElementById("form-b4").value) || 0;
            const b5 = parseFloat(document.getElementById("form-b5").value) || 0;
            
            const batterStats = [b1, b2, b3, b4, b5];

            let pitcherStats = null;
            if (posVal.includes('P')) {
                const p1 = parseFloat(document.getElementById("form-p1").value) || 0;
                const p2 = parseFloat(document.getElementById("form-p2").value) || 0;
                const p3 = parseFloat(document.getElementById("form-p3").value) || 0;
                const p4 = parseFloat(document.getElementById("form-p4").value) || 0;
                const p5 = parseFloat(document.getElementById("form-p5").value) || 0;
                pitcherStats = [p1, p2, p3, p4, p5];
            }

            let bScores = [b1, b2, b3, calcStrikeoutScore(b4), b5];
            let bAvg = bScores.reduce((a,b)=>a+b,0)/5;
            let ovrVal = bAvg;

            if (pitcherStats) {
                let pAvg = pitcherStats.reduce((a,b)=>a+b,0)/5;
                ovrVal = (bAvg + pAvg) / 2;
            }

            const newPlayer = {
                id: Date.now(),
                isWbd: isWbd,
                pos: posVal,
                name: document.getElementById("form-name").value,
                number: document.getElementById("form-number").value || 'No.0',
                image: document.getElementById("form-image").value || '',
                stationUrl: document.getElementById("form-station").value || '',
                height: document.getElementById("form-height").value || '170cm',
                ovr: parseFloat(ovrVal.toFixed(1)),
                pitcherStats: pitcherStats,
                batterStats: batterStats,
                intro: document.getElementById("form-intro").value || '신청자 소개글이 입력되지 않았습니다.',
                statPrimary: isWbd ? 'WBD 경험자' : 'SBO 신규 신청자',
                statSecondary: '신규 등록 선수',
                scoutReport: document.getElementById("form-report").value || '스카우트 사견(풀트력) 평가 의견이 없습니다.',
                highlightTitle: document.getElementById("form-title").value || '하이라이트 클립',
                highlightUrl: document.getElementById("form-url").value || ''
            };

            playersData.push(newPlayer);
            selectedPlayerId = newPlayer.id;
            document.getElementById("add-player-form").reset();
            toggleModal(false);
            renderRosterList();
        }

        window.onload = () => {
            renderRosterList();
            lucide.createIcons();
            setTimeout(() => { hideSplashOverlay(); }, 800);
        };
    </script>
