<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBO 스카우팅 리포트</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            /* 퍼스널 컬러 맞춤: 눈이 편안한 톤다운 미드나잇/애시 블루 그라데이션 */
            background: linear-gradient(135deg, #0f172a 0%, #1b263b 50%, #223048 100%);
            color: #f1f5f9;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1b263b;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a6572;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #607d8b;
        }

        .splash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0d131d;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .splash-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        @keyframes pulse-logo {
            0% {
                transform: scale(0.95);
                filter: drop-shadow(0 0 0px rgba(96, 165, 250, 0.3));
            }
            100% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 15px rgba(96, 165, 250, 0.6));
            }
        }

        .animate-sbo-logo {
            animation: pulse-logo 1.2s infinite alternate ease-in-out;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-100">

    <!-- SBO 로딩 스플래시 오버레이 -->
    <div id="splashOverlay" class="splash-overlay">
        <img src="SBO Logo.png" alt="SBO Logo" class="h-24 w-auto object-contain select-none mb-4 animate-sbo-logo" style="mix-blend-mode: screen;" onerror="this.onerror=null; this.alt='SBO LOGO';"/>
        <h1 class="text-2xl font-black tracking-widest text-white uppercase font-mono">SBO SCOUTING REPORT</h1>
        <p class="text-xs text-sky-400 mt-2 tracking-wider font-semibold">LOADING SYSTEM...</p>
    </div>

    <!-- Header Navigation -->
    <header class="bg-[#151d2a]/90 backdrop-blur border-b border-slate-700/60 px-6 py-3 flex justify-between items-center z-20">
        <div class="flex items-center gap-4">
            <div class="flex items-center">
                <img src="SBO Logo.png" alt="SBO Logo" class="h-10 w-auto object-contain select-none" style="mix-blend-mode: screen;" onerror="this.onerror=null; this.alt='SBO LOGO';"/>
            </div>
            <div class="h-6 w-px bg-slate-700/60"></div>
            <div>
                <h1 class="font-bold text-base leading-none text-slate-100">SBO 스카우팅 리포트</h1>
                <span class="text-[10px] text-slate-400">SBO Baseball Scouting System</span>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="toggleModal(true)" class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs transition-all shadow-md shadow-sky-600/20 flex items-center gap-1.5">
                <i data-lucide="user-plus" class="w-4 h-4"></i> 신규 선수 등록
            </button>
            <span class="text-xs bg-[#1e293b] px-3 py-2 rounded-xl border border-slate-700 text-slate-300 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
                <span id="registered-count">등록된 선수 0명</span>
            </span>
        </div>
    </header>

    <!-- Main Section -->
    <main class="flex-1 p-4 overflow-hidden relative">

        <section class="w-full h-full grid grid-cols-12 gap-4">
            <!-- Left Side: Roster List -->
            <div class="col-span-4 bg-[#182232]/80 border border-slate-700/50 rounded-2xl p-4 flex flex-col gap-3 overflow-hidden backdrop-blur shadow-xl">
                <div class="flex flex-col gap-2">
                    <div class="flex justify-between items-center gap-2">
                        <h2 class="text-sm font-bold flex items-center gap-2 text-white shrink-0">
                            <i data-lucide="users" class="w-4 h-4 text-sky-400"></i> 선수 명단
                        </h2>
                        <div class="flex gap-1.5">
                            <select id="roster-pos-filter" onchange="renderRosterList()" class="bg-[#0f172a] text-xs border border-slate-700 rounded-lg px-2 py-1 text-slate-300 focus:outline-none">
                                <option value="ALL">전체 포지션</option>
                                <option value="P">투수 (P)</option>
                                <option value="C">포수 (C)</option>
                                <option value="INF">내야수 (1B,2B,3B,SS)</option>
                                <option value="OF">외야수 (LF,CF,RF)</option>
                            </select>

                            <select id="roster-team-filter" onchange="renderRosterList()" class="bg-[#0f172a] text-xs border border-slate-700 rounded-lg px-2 py-1 text-slate-300 focus:outline-none">
                                <option value="ALL">전체 팀 보기</option>
                                <option value="0">천양키즈</option>
                                <option value="1">로얄 버팔로즈</option>
                                <option value="2">팀 3</option>
                                <option value="3">팀 4</option>
                            </select>
                        </div>
                    </div>

                    <!-- 탭 구분 (SBO 신규 신청자 / WBD 경험자) -->
                    <div class="grid grid-cols-2 gap-1 p-1 bg-[#0f172a] rounded-xl border border-slate-700/60">
                        <button id="tab-new" onclick="switchCategoryTab('NEW')" class="py-1.5 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200">
                            SBO 신규 신청자
                        </button>
                        <button id="tab-wbd" onclick="switchCategoryTab('WBD')" class="py-1.5 text-xs font-bold rounded-lg transition-all bg-sky-600 text-white shadow">
                            WBD 경험자
                        </button>
                    </div>

                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="roster-search-input" oninput="renderRosterList()" placeholder="선수 이름/포지션 검색..." class="w-full bg-[#0f172a] border border-slate-700 text-xs rounded-lg pl-9 pr-4 py-2 text-white focus:outline-none focus:border-sky-500">
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto pr-1">
                    <div id="roster-list-container" class="space-y-2">
                        <!-- Dynamic Player Cards -->
                    </div>
                </div>
            </div>

            <!-- Right Side: Scouting Report Details -->
            <div class="col-span-8 bg-[#182232]/80 border border-slate-700/50 rounded-2xl p-5 flex flex-col overflow-y-auto backdrop-blur gap-4 shadow-xl" id="report-view-container">
                <!-- Detailed Scouting Report Card -->
            </div>
        </section>

    </main>

    <!-- 선수 등록 모달 -->
    <div id="playerModal" class="fixed inset-0 bg-slate-950/75 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-[#182232] border border-slate-700 rounded-2xl w-full max-w-lg p-5 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center pb-3 border-b border-slate-700/60 mb-4">
                <div class="flex items-center gap-2">
                    <i data-lucide="user-plus" class="w-5 h-5 text-sky-400"></i>
                    <h2 class="text-base font-bold text-white">신규 선수 등록</h2>
                </div>
                <button onclick="toggleModal(false)" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="add-player-form" onsubmit="handleAddPlayerSubmit(event)" class="space-y-3 text-xs">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1 font-semibold">선수 구분</label>
                        <select id="form-category" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500">
                            <option value="NEW">SBO 신규 신청자</option>
                            <option value="WBD">WBD 경험자</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-semibold">소속 팀</label>
                        <select id="form-team" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500">
                            <option value="0">천양키즈</option>
                            <option value="1">로얄 버팔로즈</option>
                            <option value="2">팀 3</option>
                            <option value="3">팀 4</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1 font-semibold">포지션 구분</label>
                        <select id="form-pos" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500">
                            <optgroup label="투수">
                                <option value="P">P (투수)</option>
                            </optgroup>
                            <optgroup label="포수">
                                <option value="C">C (포수)</option>
                            </optgroup>
                            <optgroup label="내야수">
                                <option value="1B">1B (1루수)</option>
                                <option value="2B">2B (2루수)</option>
                                <option value="3B">3B (3루수)</option>
                                <option value="SS">SS (유격수)</option>
                            </optgroup>
                            <optgroup label="외야수">
                                <option value="LF">LF (좌익수)</option>
                                <option value="CF">CF (중견수)</option>
                                <option value="RF">RF (우익수)</option>
                            </optgroup>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-semibold">등번호</label>
                        <input type="text" id="form-number" placeholder="예: No.7" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-semibold">선수 이름</label>
                        <input type="text" id="form-name" required placeholder="예: 다키" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1 font-semibold">신장 (cm)</label>
                        <input type="text" id="form-height" placeholder="예: 182cm" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-sky-300 mb-1 font-semibold flex items-center gap-1">
                            <i data-lucide="image" class="w-3.5 h-3.5"></i> 프로필 이미지 파일명
                        </label>
                        <input type="text" id="form-image" placeholder="예: 다키.webp" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500">
                    </div>
                </div>

                <!-- 10점 만점 능력치 -->
                <div class="bg-[#0f172a] p-3 rounded-xl border border-slate-700/80">
                    <label class="block text-sky-300 mb-1.5 font-semibold text-[11px]">5대 세부 능력치 (10점 만점)</label>
                    <div class="grid grid-cols-5 gap-1.5">
                        <div>
                            <span class="text-[9px] text-slate-400 block text-center">정타/구속</span>
                            <input type="number" step="0.1" min="0" max="10" id="form-s1" value="5.0" required class="w-full bg-[#182232] border border-slate-700 rounded-lg p-1.5 text-center text-white font-bold">
                        </div>
                        <div>
                            <span class="text-[9px] text-slate-400 block text-center">파워/제구</span>
                            <input type="number" step="0.1" min="0" max="10" id="form-s2" value="5.0" required class="w-full bg-[#182232] border border-slate-700 rounded-lg p-1.5 text-center text-white font-bold">
                        </div>
                        <div>
                            <span class="text-[9px] text-slate-400 block text-center">수비력</span>
                            <input type="number" step="0.1" min="0" max="10" id="form-s3" value="5.0" required class="w-full bg-[#182232] border border-slate-700 rounded-lg p-1.5 text-center text-white font-bold">
                        </div>
                        <div>
                            <span class="text-[9px] text-slate-400 block text-center">스태미나</span>
                            <input type="number" step="0.1" min="0" max="10" id="form-s4" value="5.0" required class="w-full bg-[#182232] border border-slate-700 rounded-lg p-1.5 text-center text-white font-bold">
                        </div>
                        <div>
                            <span class="text-[9px] text-slate-400 block text-center">리더십/멘탈</span>
                            <input type="number" step="0.1" min="0" max="10" id="form-s5" value="5.0" required class="w-full bg-[#182232] border border-slate-700 rounded-lg p-1.5 text-center text-white font-bold">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-slate-400 mb-1 font-semibold">대표 장점 / 성적 요약</label>
                    <input type="text" id="form-stat1" placeholder="예: 전 오영택사스 소속" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500">
                </div>

                <div>
                    <label class="block text-slate-400 mb-1 font-semibold">스카우팅 리포트 분석</label>
                    <textarea id="form-report" rows="3" placeholder="분석 의견을 적어주세요..." class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500"></textarea>
                </div>

                <div>
                    <label class="block text-slate-400 mb-1 font-semibold">하이라이트 영상 링크 (SOOP / 유튜브)</label>
                    <input type="text" id="form-url" placeholder="https://vod.sooplive.com/player/... 또는 https://youtu.be/..." class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-sky-500">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="toggleModal(false)" class="w-1/3 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold hover:bg-slate-700 transition-all">취소</button>
                    <button type="submit" class="w-2/3 py-2.5 rounded-xl bg-sky-600 text-white font-bold hover:bg-sky-500 transition-all shadow-lg shadow-sky-600/30 flex items-center justify-center gap-1.5">
                        <i data-lucide="plus" class="w-4 h-4"></i> 선수 등록 완료
                    </button>
                </div>
            </form>
        </div>
    </div>

                scoutReport: "천양키즈 5라운더 출신 1루수. 입단 초 바쁜 일정으로 타격감을 상실하였으나 버팔로즈 친선전에서 밀어친 솔로 홈런을 터뜨리며 확실한 타격 툴과 실링을 입증함. 멘탈 케어와 시간적 여유만 보장된다면 강한 한 방을 보여줄 수 있으나, 악귀가 들릴 경우 타격 혈막 현상이 심해 감독의 밀착 멘탈케어가 필수적인 육성형 자원.",
                highlightUrl: ""
            },
            {

                statPrimary: "로얄 버팔로즈 소속 중심타자",

                scoutReport: "로얄 버팔로즈 소속 포수. 170cm의 신장을 가졌으며 8강 승부치기에서 결승타를 터뜨리는 등 확고한 장타 툴을 보유한 중심 타자. 마왕과 뽀린걸의 공을 받으며 포수로 성장했으나, 반응 속도 저하와 수비 안정감 부족이 단점으로 꼽힘. 4강전 이후 천양키즈와의 친선전에서는 포수보다 외야수(중견수)로 출전 시 수비력이 오히려 나아져 중견수 전환 가능성이 제기됨. 전반적으로 우수한 타격·장타력에 비해 포수로서의 리딩과 수비 안정감 개선이 필요한 자원.",
                highlightUrl: "https://vod.sooplive.co.kr/player/11223344"
            },
            {
                id: 3,
                category: "WBD",
                teamIndex: 0,
                pos: "C",
                name: "힌콕",
                image: "힌콕.webp",
                height: "168cm",
                number: "No.98",
                ovr: 8.7,
                stats: [3.2, 2.5, 9.5, 9.8, 9.4],
                statPrimary: "전 오영택사스 소속 포수",
                statSecondary: "11경기 23타수 1안타 1볼넷 (0.043) / 14삼진",
                scoutReport: "전 오영택사스 소속의 포수로, 안정적인 블로킹 능력을 갖춘 핵심 자원. 다키와 사이다 페어의 공을 묵묵히 받아내며 10회까지 마스크를 쓸 수 있는 뛰어난 체력과 리더십을 입증함. 공격력은 11경기 23타수 1안타 1볼넷(0.043), 14삼진으로 매우 부족하여 타격 개선이 필수 과제이나, 포지션 특성상 수비 리딩과 안정감이 높은 평가를 받음.",
                highlightUrl: ""
            }
        ];

        let selectedPlayerId = 1; // 기본 선택
        let reportRadarChartInstance = null;

        function hideSplashOverlay() {
            const overlay = document.getElementById("splashOverlay");
            overlay.classList.add("hidden");
        }

        function toggleModal(show) {
            const modal = document.getElementById("playerModal");
            if (show) {
                modal.classList.remove("hidden");
            } else {
                modal.classList.add("hidden");
            }
        }

        function switchCategoryTab(category) {
            currentTabCategory = category;
            const btnNew = document.getElementById("tab-new");
            const btnWbd = document.getElementById("tab-wbd");

            if (category === 'NEW') {
                btnNew.className = "py-1.5 text-xs font-bold rounded-lg transition-all bg-sky-600 text-white shadow";
                btnWbd.className = "py-1.5 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200";
            } else {
                btnWbd.className = "py-1.5 text-xs font-bold rounded-lg transition-all bg-sky-600 text-white shadow";
                btnNew.className = "py-1.5 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200";
            }

            renderRosterList();
        }

        function renderRosterList() {
            const container = document.getElementById("roster-list-container");
            const filterTeam = document.getElementById("roster-team-filter").value;
            const filterPos = document.getElementById("roster-pos-filter").value;
            const searchText = document.getElementById("roster-search-input").value.trim().toLowerCase();

            // 선택된 탭 카테고리(SBO 신규 / WBD) 필터링
            let list = playersData.filter(p => p.category === currentTabCategory);
            
            if (filterTeam !== "ALL") {
                list = list.filter(p => p.teamIndex === parseInt(filterTeam));
            }

            if (filterPos !== "ALL") {
                list = list.filter(p => getPosCategory(p.pos) === filterPos);
            }

            if (searchText) {
                list = list.filter(p => p.name.toLowerCase().includes(searchText) || p.pos.toLowerCase().includes(searchText));
            }

            document.getElementById("registered-count").innerText = `등록된 선수 ${playersData.length}명`;

            if (list.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs border border-dashed border-slate-700/60 rounded-xl">해당 카테고리에 등록된 선수가 없습니다.</div>`;
                document.getElementById("report-view-container").innerHTML = `<div class="p-8 text-center text-slate-400 text-sm my-auto">선택된 선수가 없습니다.</div>`;
                return;
            }

            if (!selectedPlayerId || !list.some(p => p.id === selectedPlayerId)) {
                selectedPlayerId = list[0].id;
            }

            container.innerHTML = list.map(player => {
                const isSelected = player.id === selectedPlayerId;
                
                let thumbImg = '';
                if (player.image) {
                    thumbImg = `<img src="${player.image}" alt="${player.name}" class="w-10 h-10 rounded-lg object-cover border border-slate-600 shrink-0" onError="this.style.display='none';"/>`;
                } else {
                    thumbImg = `<div class="w-10 h-10 bg-slate-800 rounded-lg border border-slate-600 flex items-center justify-center font-bold text-xs text-sky-400 shrink-0">${player.pos}</div>`;
                }

                return `
                    <div onclick="selectPlayerFromList(${player.id})" class="p-3 rounded-xl border transition-all cursor-pointer flex items-center justify-between ${isSelected ? 'bg-sky-600/25 border-sky-400 shadow-md shadow-sky-950/40' : 'bg-[#0f172a]/70 border-slate-700/60 hover:border-slate-500 hover:bg-[#152033]'}">
                        <div class="flex items-center gap-3">
                            ${thumbImg}
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-bold text-sky-300 font-mono">${player.number}</span>
                                    <h3 class="font-bold text-sm text-white">${player.name}</h3>
                                    <span class="text-[10px] text-sky-300 font-bold bg-sky-950/80 px-1.5 py-0.5 rounded border border-sky-700/60">${player.pos}</span>
                                </div>
                                <span class="text-[10px] text-slate-400">${teamNames[player.teamIndex] || '소속팀'} | ${player.statPrimary}</span>
                            </div>
                        </div>
                        <div class="text-right shrink-0">
                            <span class="text-xs font-extrabold text-sky-300 block">★ ${player.ovr}</span>
                            <span class="text-[10px] text-slate-400">OVR</span>
                        </div>
                    </div>
                `;
            }).join('');

            if (selectedPlayerId) {
                renderScoutingReportDetail(selectedPlayerId);
            }
        }

        function selectPlayerFromList(playerId) {
            selectedPlayerId = playerId;
            renderRosterList();
        }

        function renderScoutingReportDetail(playerId) {
            const container = document.getElementById("report-view-container");
            const player = playersData.find(p => p.id === playerId);

            if (!player) {
                container.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm my-auto">선택된 선수가 없습니다.</div>`;
                return;
            }

            const embedIframe = parseVideoEmbedUrl(player.highlightUrl);

            let profileImageHtml = '';
            if (player.image) {
                profileImageHtml = `<img src="${player.image}" alt="${player.name}" class="w-14 h-14 rounded-xl object-cover border-2 border-sky-400/60 shadow-md" onError="this.parentNode.innerHTML='<div class=\'w-14 h-14 bg-sky-950/50 text-sky-300 border border-sky-500/40 rounded-xl flex items-center justify-center font-bold text-lg\'>${player.pos}</div> me';"/>`;
            } else {
                profileImageHtml = `<div class="w-14 h-14 bg-sky-950/50 text-sky-300 border border-sky-500/40 rounded-xl flex items-center justify-center font-bold text-lg">${player.pos}</div>`;
            }

            const categoryTag = player.category === 'NEW' 
                ? `<span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs px-2 py-0.5 rounded font-bold">SBO 신규</span>`
                : `<span class="bg-teal-500/20 text-teal-300 border border-teal-500/40 text-xs px-2 py-0.5 rounded font-bold">WBD 경험자</span>`;

            container.innerHTML = `
                <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                    <div class="flex items-center gap-4">
                        ${profileImageHtml}
                        <div>
                            <div class="flex items-center gap-2">
                                ${categoryTag}
                                <span class="bg-sky-500/15 text-sky-300 border border-sky-400/30 text-xs px-2 py-0.5 rounded font-mono font-bold">${player.number}</span>
                                <h2 class="text-xl font-bold text-white">${player.name}</h2>
                                <span class="bg-sky-600/20 text-sky-300 border border-sky-500/30 text-xs px-2 py-0.5 rounded font-bold">${player.pos}</span>
                                <span class="text-xs text-slate-400 font-mono">(${player.height})</span>
                            </div>
                            <p class="text-xs text-slate-300 mt-1">주요특징: ${player.statPrimary}</p>
                        </div>
                    </div>
                    <div class="text-right bg-sky-950/50 border border-sky-500/30 px-4 py-2 rounded-xl">
                        <span class="text-[10px] text-sky-300 block font-semibold">종합 능력치 (Overall)</span>
                        <span class="text-2xl font-black text-sky-300">${player.ovr} <span class="text-xs text-slate-400 font-normal">/ 10</span></span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 my-1">
                    <div class="bg-[#0f172a]/70 border border-slate-700/60 p-3 rounded-xl flex flex-col items-center justify-center relative min-h-[200px]">
                        <span class="text-[10px] text-slate-400 absolute top-2 left-3 font-semibold">선수 종합 스탯 다이어그램</span>
                        <canvas id="reportRadarChart" class="max-h-[170px]"></canvas>
                    </div>

                    <div class="bg-[#0f172a]/70 border border-slate-700/60 p-4 rounded-xl flex flex-col justify-between">
                        <div>
                            <span class="text-xs text-sky-400 font-bold block mb-1.5">스카우트 수석 리포트</span>
                            <p class="text-xs text-slate-200 leading-relaxed font-normal">${player.scoutReport}</p>
                        </div>
                        <div class="pt-2.5 border-t border-slate-700/60 grid grid-cols-2 gap-2 mt-3">
                            <div>
                                <span class="text-[10px] text-slate-400 block font-medium">주요 성적/특이사항</span>
                                <strong class="text-xs text-slate-200 truncate block mt-0.5" title="${player.statSecondary}">${player.statSecondary}</strong>
                            </div>
                            <div>
                                <span class="text-[10px] text-slate-400 block font-medium">핵심 과제</span>
                                <strong class="text-xs text-sky-300 font-bold truncate block mt-0.5">${player.name === '양도끼' ? '1루수 한정 타격 장타력 개선' : player.name === '미르' ? '지속적인 멘탈 케어 및 실전 타격 정착' : player.name === '리냐' ? '사구 관리 및 어깨 컨디션 조절' : player.name === '윤이제' ? '포수 수비 안정감 및 포지션 정립' : player.pos === 'C' ? '공격력/타격 능력 개선' : player.pos === 'P' ? '제구력 유지 및 스태미나' : '경기 감각 유지'}</strong>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex-1 flex flex-col bg-[#0f172a]/70 border border-slate-700/60 rounded-xl p-3">
                    <div class="flex items-center gap-1.5 mb-2">
                        <i data-lucide="video" class="w-4 h-4 text-sky-400"></i>
                        <span class="text-xs font-bold text-slate-200">명장면 & 클립 영상</span>
                    </div>
                    <div class="w-full aspect-video bg-slate-900 rounded-lg overflow-hidden border border-slate-800 flex items-center justify-center relative">
                        ${embedIframe}
                    </div>
                </div>
            `;

            lucide.createIcons();
            renderReportRadarChart(player);
        }

        function parseVideoEmbedUrl(url) {
            if (!url) return `<div class="text-center text-slate-500 text-xs">등록된 하이라이트 영상이 없습니다.</div>`;
            
            if (url.includes('sooplive.co.kr') || url.includes('afreecatv.com') || url.includes('sooplive.com')) {
                let match = url.match(/(?:player\/|b_no=)(\d+)/);
                if (match && match[1]) {
                    return `<iframe class="w-full h-full" src="https://vod.sooplive.co.kr/player/${match[1]}/embed" frameborder="0" allowfullscreen></iframe>`;
                }
            }
            
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0].split('&')[0];
                } else if (url.includes('v=')) {
                    videoId = url.split('v=')[1].split('&')[0].split('?')[0];
                }
                
                if (videoId) {
                    return `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>`;
                }
            }
            
            return `<iframe class="w-full h-full" src="${url}" frameborder="0" allowfullscreen></iframe>`;
        }

        function renderReportRadarChart(player) {
            const ctx = document.getElementById('reportRadarChart').getContext('2d');
            const labels = player.pos === 'P' ? ['구속', '제구', '구위', '스태미나', '멘탈'] : ['정타', '파워', '수비', '체력', '리더십'];

            if (reportRadarChartInstance) reportRadarChartInstance.destroy();

            reportRadarChartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: player.name,
                        data: player.stats,
                        backgroundColor: 'rgba(56, 189, 248, 0.25)',
                        borderColor: '#38bdf8',
                        borderWidth: 2,
                        pointBackgroundColor: '#7dd3fc'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: { color: '#334155' },
                            grid: { color: '#334155' },
                            pointLabels: { color: '#e2e8f0', font: { size: 10, weight: 'bold' } },
                            ticks: { display: false },
                            suggestedMin: 0,
                            suggestedMax: 10
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function handleAddPlayerSubmit(e) {
            e.preventDefault();
            const s1 = parseFloat(document.getElementById("form-s1").value) || 0;
            const s2 = parseFloat(document.getElementById("form-s2").value) || 0;
            const s3 = parseFloat(document.getElementById("form-s3").value) || 0;
            const s4 = parseFloat(document.getElementById("form-s4").value) || 0;
            const s5 = parseFloat(document.getElementById("form-s5").value) || 0;
            const overall = ((s1 + s2 + s3 + s4 + s5) / 5).toFixed(1);

            const teamIdx = parseInt(document.getElementById("form-team").value);
            const category = document.getElementById("form-category").value;

            const newPlayer = {
                id: Date.now(),
                category: category,
                teamIndex: teamIdx,
                pos: document.getElementById("form-pos").value,
                name: document.getElementById("form-name").value,
                number: document.getElementById("form-number").value || 'No.0',
                image: document.getElementById("form-image").value || '',
                height: document.getElementById("form-height").value || '170cm',
                ovr: parseFloat(overall),
                stats: [s1, s2, s3, s4, s5],
                statPrimary: document.getElementById("form-stat1").value || '특징 미입력',
                statSecondary: '신규 등록 선수',
                scoutReport: document.getElementById("form-report").value || '의견 없음',
                highlightUrl: document.getElementById("form-url").value || ''
            };

            playersData.push(newPlayer);
            currentTabCategory = category;
            switchCategoryTab(category);
            selectedPlayerId = newPlayer.id;
            document.getElementById("add-player-form").reset();
            toggleModal(false);
            renderRosterList();
        }

        window.onload = () => {
            renderRosterList();
            lucide.createIcons();

            setTimeout(() => {
                hideSplashOverlay();
            }, 800);
        };
    </script>
</body>
</html>
